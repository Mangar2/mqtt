# YAHA Pushover Client Configuration
# ================================
# Complete template with all supported options.

[mqtt]
host = 127.0.0.1
port = 1883
clientId = yahapushoverclient
reconnectDelayMs = 1000
keepAliveIntervalMs = 30000
loopSleepMs = 20
logReason = true

[pushover]
# Pushover host
host = api.pushover.net
# Pushover messages endpoint
path = /1/messages.json
# Pushover API port [1..65535]
port = 443
# Required application token
token = your-application-token
# Required user key
user = your-user-key
# Enable inbound MQTT message logs in broker-format
logIncomingMessages = false
# Enable outbound MQTT message logs in broker-format
logOutgoingMessages = false
# Include reason chain in MQTT message logs
logReason = true

# Define one [device] section per device.
[device]
name = iphone

[device]
name = ipad

# Define one [subscription] section per topic filter.
# Required keys per section: topic, qos
[subscription]
topic = $MONITOR/incident/#
qos = 1

[subscription]
topic = home/alarm/#
qos = 1

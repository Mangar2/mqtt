# YAHA OpenSenseMap Client Configuration
# ======================================
# Complete template with all supported options.

[mqtt]
host = 127.0.0.1
port = 1883
clientId = yahaopensensemapclient
reconnectDelayMs = 1000
keepAliveIntervalMs = 30000
loopSleepMs = 20

[opensensemap]
# Optional station name
station = my-station
# OpenSenseMap senseBox identifier
id = your-sensebox-id
# OpenSenseMap ingress host
host = ingress.opensensemap.org
# OpenSenseMap ingress port [1..65535]
port = 443
# Sensor subscription qos [0..2]
qos = 1
# true = HTTPS, false = HTTP
useTls = true
# Log every incoming MQTT message to stdout in broker-format, independent of
# whether the upload guard suppresses it or the upload succeeds/fails
logIncomingMessages = false
# Include reason chain in inbound MQTT message logs
logReason = true

# Define one dedicated [sensor] section per sensor.
# Required keys per section: name, unit, topic, id
# Optional per sensor: minUploadIntervalSeconds (0 disables upload rate guard).
# This is a local client-side minimum interval between uploads to OpenSenseMap
# per sensor; it does not come from and is not reported to OpenSenseMap itself.
# If the underlying MQTT publisher sends more often than this interval, extra
# messages are silently dropped and logged as opensensemap[warn] guard-active.
[sensor]
name = temperature
unit = C
topic = home/outdoor/temperature
id = sensor-temperature-id
minUploadIntervalSeconds = 60

[sensor]
name = humidity
unit = %
topic = home/outdoor/humidity
id = sensor-humidity-id
minUploadIntervalSeconds = 60

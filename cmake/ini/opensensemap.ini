# YAHA OpenSenseMap Client Configuration
# ======================================
# Complete template with all supported options.

[mqtt]
host = 127.0.0.1
port = 1883
clientId = yahaopensensemapclient
reconnectDelayMs = 1000
keepAliveIntervalMs = 30000
loopSleepMs = 20
logReason = true

[opensensemap]
# Optional station name
station = my-station
# OpenSenseMap senseBox identifier
id = your-sensebox-id
# OpenSenseMap ingress host
host = ingress.opensensemap.org
# OpenSenseMap ingress port [1..65535]
port = 443
# Sensor subscription qos [0..2]
qos = 1
# true = HTTPS, false = HTTP
useTls = true

# Define one dedicated [sensor] section per sensor.
# Required keys per section: name, unit, topic, id
[sensor]
name = temperature
unit = C
topic = home/outdoor/temperature
id = sensor-temperature-id

[sensor]
name = humidity
unit = %
topic = home/outdoor/humidity
id = sensor-humidity-id

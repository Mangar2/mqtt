[serialdevice.switch.topicMap]
# topic = command,value,address
ground/wardrobe/i2c/switch/network switch = switch,2,main
ground/wardrobe/i2c/switch/charge = switch,4,main
ground/wardrobe/i2c/switch/monitor = switch,8,main
ground/wardrobe/i2c/switch/backup = switch,16,main
ground/wardrobe/i2c/switch/server = switch,32,main
ground/wardrobe/i2c/switch/internet = switch,64,main

[serialdevice.serial.receiverMap]
# topic prefix = serial receiver address

[serialdevice.serial.valueMap]
# mapName = description=...;usedby=<command,...>;map=<text:number|text:number>
LightOnOff = description=Switches light on/off by setting the light on time in seconds;usedby=V;map=on:3600|off:0

# YAHA SerialDevice Client Configuration
# ======================================
# Complete template with all supported options.

[mqtt]
host = 127.0.0.1
port = 1883
clientId = yahaserialdeviceclient
reconnectDelayMs = 1000
keepAliveIntervalMs = 30000
loopSleepMs = 20
logReason = true

[serialdevice]
# Required serial port name
serialPortName = /dev/ttyUSB0
# Baudrate [1..4000000]
baudrate = 38400
# Subscription/publish QoS [0..2]
qos = 1
# Trace level: errors, messages, internal
trace = internal
# Enable inbound MQTT message logs in broker-format
logIncomingMessages = false
# Enable outbound MQTT message logs in broker-format
logOutgoingMessages = false
# Include reason chain in inbound/outbound message logs
logReason = true
# Keep-alive interval in seconds [1..86400]
keepAliveDelayInSeconds = 30

[serialdevice.i2c.commandMap]
# serial command = topic suffix
L = brightness sensor/brightness
M = motion sensor/detection state
R = temperature and humidity sensor/read error code
H = temperature and humidity sensor/humidity in percent
T = temperature and humidity sensor/temperature in celsius
K = light/light on time in seconds
B = light/light activation brightness
D = temperature and humidity sensor/pin
E = system/error level
I = light/target intensity
O = light/light start voltage
P = light/dimming delay in milliseconds
S = Arduino base settings/I2C server address
A = Arduino base settings/I2C client address
l = light/light on time
WardrobeTempSys = i2c/status/temperature
Version = i2c/status/version

[serialdevice.serial.commandMap]
# serial command = topic suffix
a = Arduino Status Information/internal communication state
b = Brightness Sensor/brightness in percent
c = Arduino clock/time of day in minutes
d = Arduino Status Information/debug information
e = Arduino Status Information/received error
h = Temperature and Humidity Sensor/humidity in percent
l = Light/light on time
m = Motion Sensor/detection state
n = Motion Sensor/detection state
o = window/detection state
p = Air pressure/air pressure in millibar
r = Temperature and Humidity Sensor/read error code
s = Arduino Status Information/internal temperature in celsius
t = Temperature and Humidity Sensor/temperature in celsius
v = Light/light voltage
w = Water leakage/detection state
y = Arduino Status Information/move controller state
z = Arduino Status Information/memory left in bytes

[serialdevice.i2c.receiverMap]
# topic prefix = serial receiver address
ground/wardrobe/main/ = 3
ground/hallway/center/ = 4
ground/hallway/wall/ = 5
$SYS/central/ = main

[serialdevice.fs20.commandMap]
# fs20 command = topic suffix
12322324/2112 = ground/livingroom/fs20/switch/amplifier
12322324/2113 = ground/livingroom/fs20/switch/appletv
12322324/2311 = ground/wardrobe/i2c/switch/internet
12322324/2321 = ground/wardrobe/i2c/switch/monitor
12322324/2332 = ground/wardrobe/fs20/switch/floor heating
12322324/4111 = outdoor/garden/main/switch/socketParkingplace
12322324/4112 = outdoor/garden/main/switch/pump
12322324/4113 = outdoor/garden/main/switch/lightStairs
12322324/4114 = outdoor/garden/main/switch/socketStonefield
12322324/4121 = outdoor/garden/fs20/switch/brook
12322324/4122 = outdoor/garden/fs20/switch/light stonefield
12322324/4123 = outdoor/garden/fs20/switch/light pathway

[serialdevice.fs20.sendMap]
# optional fallback mapping for send path
12322324/2111 = ground/livingroom/zwave/switch/multimedia
12322324/2114 = ground/livingroom/zwave/switch/camera
12322324/2211 = ground/livingroom/zwave/switch/charge
12322324/2312 = ground/livingroom/zwave/switch/floodlight
12322324/2314 = ground/wardrobe/zwave/switch/ventilation
12322324/3112 = first/study/zwave/switch/monitorvolker
12322324/3113 = first/study/zwave/switch/laserprinter
12322324/3114 = first/study/zwave/switch/pcvolker
12322324/3121 = first/study/zwave/switch/pcmaster
12322324/3123 = first/study/zwave/switch/pcregina

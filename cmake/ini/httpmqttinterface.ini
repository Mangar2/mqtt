# YAHA HTTP MQTT Interface Client Configuration
# =============================================
# Complete template with all supported options.

[mqtt]
host = 127.0.0.1
port = 1883
clientId = yahahttpmqttinterfaceclient
reconnectDelayMs = 1000
keepAliveIntervalMs = 30000
loopSleepMs = 20

[httpMqttInterface]
# HTTP listener bind host
listenerHost = 0.0.0.0
# HTTP listener bind port [1..65535]
listenerPort = 8092
# Enables /publish.php compatibility route
enablePublishPhpAlias = true
# Legacy PHP response mode toggle
useLegacyPhpResponse = false
# HTTP request ingress logs
logIncomingRequests = true
# Domain event logs (connect, subscribe, unsubscribe, disconnect, ping, connected client reports)
logEvents = true
# Error logs
logErrors = true
# Broker in/out message logs
logBrokerMessages = true
# Includes reason chain in broker message logs
logReason = true
# Publish dispatch tracing logs (broker_publish_dispatch, broker_publish_sent)
logTracing = false
# Connected-clients report interval in seconds [1..86400]
connectedClientsReportIntervalSeconds = 60

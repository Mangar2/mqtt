# YAHA ZWave Client Configuration
# ===============================
# Legacy-equivalent configuration migrated from spec/yaha/zwave_config.json.

[mqtt]
host = 127.0.0.1
port = 1883
clientId = yaha/zwave
reconnectDelayMs = 1000
keepAliveIntervalMs = 30000
loopSleepMs = 20
logReason = true

[filestore]
# Enable/disable FileStore-based ZWave settings synchronization.
# If enabled, device rows are loaded from FileStore JSON and merged with INI.
use = false
# FileStore host
host = 127.0.0.1
# FileStore port [1..65535]
port = 8210
# Key path for ZWave settings JSON in FileStore.
# The client writes the full effective settings snapshot to this key.
filename = /zwave/settings
# Per-node override rule:
# If FileStore contains any row for node N, all INI device rows for node N are replaced.

[zwave]
subscribeQoS = 1
qos = 1
retain = false
# OpenZWave/service event logging level:
# 0 = disable OpenZWave protocol logs and suppress zwave_service event logs
# 1 = OpenZWave errors + important zwave_service events/errors
# 2 = OpenZWave protocol info + important zwave_service events/errors
# 3 = OpenZWave protocol detail + important zwave_service events/errors
# 4 = OpenZWave protocol debug/stream detail + important zwave_service events/errors
logLevel = 1
# MQTT in/out message tracing flags (independent from logLevel):
logIncomingMessages = true
logOutgoingMessages = true
# Polling interval for zwave values for reachable switches in milliseconds. Default 500ms. (0 no polling).
pollIntervalMs = 1000
# Poll interval in milliseconds for command reaction tracking.
# The controller requests fresh node state for nodes with pending commands.
# Default 500ms. Allowed range 1..60000.
commandReactionPollIntervalMs = 500
# Timeout in milliseconds for pending command reaction tracking.
# Pending command entries are removed after this timeout if no matching feedback arrives.
# Default 30000ms. Allowed range 1..600000.
commandReactionTimeoutMs = 30000

usbDevice = /dev/zwave
usbTopic = $SYS/zwave/usb stick

# Format: topic|nodeId|classId|instance|index|type|label
# Example: zwave/node/5/37/1/0/targetValue|5|37|1|0|targetValue|Switch Binary Target Value